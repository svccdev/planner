<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141416">
<title>Панель персонажа — 90 дней</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#141416;--card:#1e1e23;--card2:#27272e;--line:#2d2d35;--tx:#ececf1;--sub:#9c9ca6;
  --ac:#9224a3;--ac2:#b655c4;--acsoft:rgba(146,36,163,.16);--ok:#3ecf8e;--warn:#e5a13a;--bad:#e0525c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;user-select:none}
input,select{font:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 14px calc(96px + env(safe-area-inset-bottom))}
#topbar{position:sticky;top:0;z-index:20;background:rgba(20,20,22,.94);backdrop-filter:blur(10px);margin:0 -14px;padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
#topbar .tt{min-width:0}
#topbar .tt h1{font-size:19px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tt .sub{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.iconbtn.ac{background:var(--acsoft);border-color:rgba(146,36,163,.4);color:var(--ac2)}
#view{padding-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:9px}
.card h2 .ic{color:var(--ac2);display:flex}
.card .hint{font-size:12px;color:var(--sub);margin-top:3px}
.bar{height:8px;border-radius:99px;background:#2b2b32;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px;transition:width .4s}
.bar.ok>i{background:linear-gradient(90deg,#2a9d6f,#3ecf8e)}
.qrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
.qrow .qt{min-width:0;flex:1}
.qrow .qt .qn{font-size:14.5px;font-weight:600}
.qrow .qt .qs{font-size:12px;color:var(--sub);margin-top:1px}
.qrow .qt .qs b{color:var(--tx);font-weight:600}
.tile{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--card2);color:var(--ac2);border:1px solid var(--line)}
.tile.done{background:var(--acsoft);border-color:rgba(146,36,163,.45)}
.step{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.step button{width:34px;height:36px;background:none;border:0;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.step button:active{background:var(--acsoft);color:var(--ac2)}
.step .val{min-width:52px;text-align:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.step .val small{display:block;font-size:10px;color:var(--sub);font-weight:500}
.chk{width:36px;height:36px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none}
.chk.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12px;color:var(--sub)}
.chip b{color:var(--tx)}
.chip.flame b{color:var(--warn)}
@property --p{syntax:'<number>';inherits:false;initial-value:0}
.ring{width:64px;height:64px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;position:relative;background:conic-gradient(var(--ac) calc(var(--p)*1%),#2b2b32 0);transition:--p 1.05s cubic-bezier(.25,.9,.3,1)}
.ring::after{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--card)}
.ring span{position:relative;z-index:1;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;display:block;border:2.5px solid rgba(146,36,163,.55);box-shadow:0 0 0 4px var(--acsoft),0 8px 24px rgba(0,0,0,.45);margin:0 auto}
.lvlname{font-size:17px;font-weight:800;text-align:center;margin-top:10px}
.lvlsub{text-align:center;font-size:12px;color:var(--sub);margin-top:2px}
.avatarwrap{position:relative;width:104px;margin:0 auto}
.rankbadge{position:absolute;right:-9px;bottom:-9px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 4px 10px rgba(0,0,0,.65))}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:18px;padding:17px 16px;font-size:16.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 10px 26px rgba(146,36,163,.35),inset 0 1px 0 rgba(255,255,255,.18);margin-bottom:12px;transition:transform .15s,filter .15s}
.bigbtn:active{filter:brightness(.88);transform:scale(.98)}
.daysum{font-size:13px;color:var(--sub);padding:10px 2px 2px;border-top:1px solid var(--line);margin-top:4px}
.daysum b{color:var(--ok);font-size:15px}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;transition:opacity .3s}
#modal.hidden{display:none}
#modal.center{align-items:center;padding:22px}
#modal.fadeout{opacity:0}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:480px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow-x:hidden;overflow-y:auto;transition:transform .28s cubic-bezier(.2,.9,.3,1.15),opacity .28s;animation:mslide .3s cubic-bezier(.2,.9,.3,1.1)}
#modal.center .mcard{border-radius:24px;max-width:340px;padding:22px 18px;animation:mpop .28s cubic-bezier(.2,.9,.3,1.15)}
.mcard.collapse{transform:scale(.04);opacity:0;transition:transform .4s cubic-bezier(.6,-.28,.75,-.1),opacity .36s ease-in .04s}
@keyframes mslide{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes mpop{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
.minih{text-align:center;margin-bottom:16px}
.minih .mt{font-size:18px;font-weight:800}
.minih .ms{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.45}
.amt{font-size:21px!important;font-weight:800;text-align:center;letter-spacing:.4px;height:56px!important}
.celeb{text-align:center;padding:8px 0 4px}
.celeb .ck{width:76px;height:76px;margin:4px auto 16px;border-radius:50%;background:rgba(62,207,142,.13);border:1.5px solid rgba(62,207,142,.55);display:flex;align-items:center;justify-content:center;color:var(--ok);animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
.celeb .tw{display:block;width:fit-content;margin:0 auto;font-size:31px;font-weight:900;letter-spacing:.5px;text-transform:lowercase;animation:fadeUp .4s .18s both}
.celeb .tw.t1{animation:fadeUp .45s .16s both}
.celeb .tw.t2{animation:twpop .5s .14s cubic-bezier(.2,1.7,.4,1) both}
.celeb .tw.t3{animation:twpop .55s .12s cubic-bezier(.2,1.8,.4,1) both;text-shadow:0 0 16px currentColor}
.celeb .tw.t4{font-size:34px;animation:twpop .6s .1s cubic-bezier(.2,1.9,.4,1) both,twshake .5s .62s;text-shadow:0 0 10px currentColor,0 0 34px currentColor}
.celeb .tw.t5{font-size:36px;letter-spacing:1.5px;animation:twpop .65s .08s cubic-bezier(.2,2,.4,1) both,twglow 1s .6s ease-in-out infinite alternate;text-shadow:0 0 12px currentColor,0 0 46px currentColor}
@keyframes twpop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes twshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}50%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
@keyframes twglow{from{filter:brightness(1)}to{filter:brightness(1.45)}}
.celeb .ta{font-size:14.5px;color:var(--sub);margin-top:8px;animation:fadeUp .4s .3s both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}55%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.shake{animation:shake .42s}
@keyframes navpulse{0%{transform:scale(1)}35%{transform:scale(1.5)}65%{transform:scale(.92)}100%{transform:scale(1)}}
.nav4 button.pulse{animation:navpulse .85s cubic-bezier(.3,1.2,.4,1)}
#fx{position:fixed;inset:0;z-index:65;pointer-events:none;overflow:hidden}
.emoji{position:absolute;left:0;top:0;font-size:30px;will-change:transform,opacity;filter:drop-shadow(0 4px 10px rgba(0,0,0,.55));opacity:0}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:15px;padding:11px 13px}
.stat .sv{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .sl{font-size:11.5px;color:var(--sub);margin-top:2px}
.goalimg{width:100%;height:150px;object-fit:cover;display:block;border-radius:14px;border:1px solid var(--line)}
.goalhead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.goalhead .big{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.goalhead .gl{font-size:12px;color:var(--sub);margin-top:2px}
.nav4{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(23,23,27,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;gap:2px;padding:7px 10px calc(7px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.nav4 button{flex:1;background:none;border:0;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:7px 0 5px;border-radius:14px}
.nav4 button.on{color:var(--ac2);background:var(--acsoft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ac);border:0;color:#fff;font-weight:700;font-size:14px;border-radius:14px;padding:11px 16px;width:100%}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--tx)}
.btn.mini{width:auto;padding:8px 13px;font-size:13px;border-radius:12px}
.mcard h3{font-size:17px;font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.field input,.field select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:11px 13px;color:var(--tx);outline:none;font-size:15px}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.field input:focus,.field select:focus{border-color:var(--ac)}
#levelup{position:fixed;inset:0;z-index:60;background:rgba(10,10,12,.82);display:flex;align-items:center;justify-content:center;padding:24px}
#levelup.hidden{display:none}
.lu{background:linear-gradient(160deg,#26122c,#1a1a20);border:1px solid rgba(146,36,163,.55);border-radius:24px;padding:26px 22px;text-align:center;max-width:340px;width:100%;box-shadow:0 18px 60px rgba(146,36,163,.25)}
.lu .lt{font-size:12px;letter-spacing:2px;color:var(--ac2);font-weight:700}
.lu .ln{font-size:40px;font-weight:900;margin:8px 0 2px}
.lu .lr{font-size:19px;font-weight:800;color:var(--ac2)}
.lu p{font-size:13px;color:var(--sub);margin-top:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:70;background:#2c2c33;border:1px solid var(--line);color:var(--tx);font-size:13px;padding:10px 16px;border-radius:13px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86vw;text-align:center}
#toast.show{opacity:1}
.gaterow{display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.gaterow:first-of-type{border-top:0}
.gbadge{width:34px;height:34px;border-radius:11px;background:var(--acsoft);color:var(--ac2);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
.gaterow .gt{min-width:0;flex:1}
.gaterow .gt .gd{font-size:13.5px;font-weight:700}
.gaterow .gt .gc{font-size:12px;color:var(--sub);margin-top:2px}
.gaterow.past{opacity:.45}
.wk{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.wk:first-of-type{border-top:0}
.wk .wn{font-size:13px;font-weight:600;flex:1;min-width:0}
.wk .bar{flex:2}
.wk .wv{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;flex:none;min-width:64px;text-align:right}
.incrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
.incrow:first-of-type{border-top:0}
.srcb{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none;background:var(--acsoft);color:var(--ac2)}
.incrow .it{flex:1;min-width:0}
.incrow .it .ia{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.incrow .it .id{font-size:11.5px;color:var(--sub)}
.del{width:30px;height:30px;border-radius:10px;border:0;background:none;color:var(--sub);display:flex;align-items:center;justify-content:center;flex:none}
.divider{font-size:11px;letter-spacing:1.5px;color:var(--sub);font-weight:700;margin:16px 2px 8px}
.perfect{display:flex;align-items:center;gap:9px;background:var(--acsoft);border:1px solid rgba(146,36,163,.4);border-radius:14px;padding:10px 13px;font-size:13px;font-weight:600;color:var(--ac2)}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:18px 8px}
/* ===== правки v3: анимации, оверфлоу, фиолетовый XP ===== */
.qrow .qt .qs b.xp{color:var(--ac2)}
.chk.pop,.tile.pop{animation:qpop .42s cubic-bezier(.3,1.6,.4,1)}
@keyframes qpop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
.perfect{animation:qpop .5s .05s cubic-bezier(.3,1.6,.4,1) both}
.bar.over>i{position:relative;overflow:hidden;background:linear-gradient(90deg,#8e2b9e,#9224a3 30%,#e9c46a 62%,#b655c4)}
.bar.over>i::after{content:'';position:absolute;top:0;bottom:0;left:-75%;width:60%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.5) 42%,rgba(233,196,106,.9) 55%,rgba(255,255,255,0));animation:xpflow 2.6s cubic-bezier(.45,0,.3,1) infinite;will-change:transform}
@keyframes xpflow{0%{transform:translateX(0)}62%,100%{transform:translateX(295%)}}
.overchip{display:inline-flex;align-items:center;gap:5px;background:var(--acsoft);border:1px solid rgba(146,36,163,.45);color:var(--ac2);border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;animation:qpop .5s .1s cubic-bezier(.3,1.6,.4,1) both}
.rankrow .tile{background:none;border:0}
/* расписание дня */
.srow{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;background:var(--card2);border:1px solid transparent}
.srow+.srow{margin-top:5px}
.srow .stime{font-size:11.5px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums;width:88px;flex:none}
.srow .stt{min-width:0;flex:1}
.srow .sn{font-size:13.5px;font-weight:600}
.srow .sd{font-size:11.5px;color:var(--sub);margin-top:1px}
.srow .sic{color:var(--sub);display:flex;flex:none}
.srow .snow{display:none;font-size:9.5px;font-weight:800;color:var(--ac2);letter-spacing:1px;text-transform:uppercase;flex:none}
.srow.now{background:var(--acsoft);border-color:rgba(146,36,163,.5)}
.srow.now .sn{color:var(--ac2)}
.srow.now .snow{display:block;animation:blink 1.15s ease-in-out infinite alternate}
.srow.now .sic{color:var(--ac2)}
.srow.past{opacity:.42}
@keyframes blink{from{opacity:.45}to{opacity:1}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="tt"><h1 id="tb-title">Панель</h1><div class="sub" id="tb-sub"></div></div>
    <div id="tb-actions" style="display:flex;gap:8px"></div>
  </header>
  <main id="view"></main>
</div>
<nav class="nav4" id="tabbar"></nav>
<div id="fx"></div>
<div id="modal" class="hidden"><div class="mcard" id="mcard"></div></div>
<div id="levelup" class="hidden"><div class="lu" id="lu-box"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ===== Константы плана ===== */
const LS='quest_panel_v1';
const FIRST_DAY='2026-11-22';    // вс, день подготовки (неделя 0)
const PLAN_START='2026-11-23';   // пн, день 1 — неделя 1 (23.11–29.11)
const PLAN_END='2027-02-21';
const GATES=[
 {k:'A',d:'2026-12-06',c:'0 диалогов при 300+ отправках или CR ответов ниже 2% — смена ICP и канала, переработка first touch'},
 {k:'B',d:'2026-12-20',c:'Суммарный доход меньше 200 USDT — сдвиг веса в T1/RU, смена ниши T2 по данным ответов'},
 {k:'C',d:'2027-01-17',c:'0 ретейнеров при 2+ выполненных заказах — дешёвый пилот 99–149 USDT, апгрейд текущим клиентам'},
 {k:'D',d:'2027-01-31',c:'Плановый выбор направления — фиксация главного по критериям раздела 6.4, перераспределение 80/20'},
 {k:'E',d:'2027-02-14',c:'Тест делегации окупился (маржа ≥50%) — найм 2–3 исполнителей, иначе чистка SOP и повтор теста'}
];
/* Месяцы плана = блоки недель из раздела 7.1 плана (не календарные 30 дней).
   Месяц 1 принимает доход и с дня подготовки (22.11), чтобы первый профит не терялся. */
const MONTHS=[
 {n:1,from:'2026-11-22',to:'2026-12-20',lo:400,hi:800,t:600,label:'Месяц 1 · Недели 1–4',dstr:'22.11–20.12'},
 {n:2,from:'2026-12-21',to:'2027-01-17',lo:1200,hi:2500,t:1850,label:'Месяц 2 · Недели 5–8',dstr:'21.12–17.01'},
 {n:3,from:'2027-01-18',to:'2027-02-21',lo:2500,hi:4500,t:3500,label:'Месяц 3 · Недели 9–13',dstr:'18.01–21.02'}
];
const PHASES=[[1,2,'Разгон'],[3,4,'Первые деньги'],[5,8,'Продуктизация'],[9,13,'Масштаб и выбор']];
const LEVELS=[
 [0,'Новобранец'],[700,'Кандидат'],[1500,'Хантер'],[2400,'Специалист'],
 [3400,'Гриндер'],[4500,'Машина'],[5700,'Автоматизатор'],[7000,'Стратег'],
 [8400,'Архитектор'],[9900,'Управляющий'],[11500,'Титан'],[13200,'Божество']
];
const SOURCES=[['T0','Bounty web3'],['T1','Биржи'],['T2','Аутрич'],['T3','Ретейнер'],['X','Другое']];

/* ===== Даты и день плана ===== */
function iso(d){d=d||new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function pISO(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function diffDays(a,b){return Math.round((pISO(b)-pISO(a))/86400000);}
function dayInfo(diso){
 const dn=new Date(pISO(diso));
 const dn2=['вс','пн','вт','ср','чт','пт','сб'][dn.getDay()];
 const mn=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'][dn.getMonth()];
 const label=dn.getDate()+' '+mn+', '+dn2;
 const dow=dn.getDay(); // 0=вс
 if(diso<PLAN_START)return {n:0,week:0,phase:'Подготовка',type:'rest',dow,label,full:false,prep:true};
 const n=diffDays(PLAN_START,diso)+1;
 const week=Math.min(13,Math.floor((n-1)/7)+1);
 let phase='Разгон';for(const[a,b,name]of PHASES){if(week>=a&&week<=b)phase=name;}
 const type=dow===0?'rest':dow===6?'half':'full';
 return {n,week,phase,type,dow,label,full:n<=91,prep:false};
}
function curMonthIdx(diso){
 for(let i=0;i<MONTHS.length;i++){if(diso>=MONTHS[i].from&&diso<=MONTHS[i].to)return i;}
 return diso<PLAN_START?0:MONTHS.length-1;
}

function dayRec(diso){return S.days[diso]||{};}
function dayXP(diso,type){
 const r=dayRec(diso);let x=0;
 const qs=questsFor(type);
 for(const q of qs){
  const v=q.kind==='count'?(r[q.k]||0):(r[q.k]?1:0);
  if(q.kind==='count'){x+=Math.min(v,q.target)*q.xp;}
  else{if(v)x+=q.xp;}
 }
 for(const q of BONUS_QUESTS){if(r[q.k])x+=q.xp;} /* доп-квесты — сверху нормы */
 const coreQ=qs.filter(q=>!q.opt);
 const allCore=coreQ.length>0&&coreQ.every(q=>q.kind==='count'?(r[q.k]||0)>=q.target:!!r[q.k]);
 if(allCore)x+=30;
 return {x,allCore};
}
/* Норма дня = XP всех обязательных квестов этого дня (+30 за идеальный день).
   В день без обязательных (вс) нормой становится разминочный квест. */
function dayNorm(type){
 const qs=questsFor(type);
 const core=qs.filter(q=>!q.opt);
 const base=core.length?core:qs;
 let n=base.reduce((a,q)=>a+(q.kind==='count'?q.xp*q.target:q.xp),0);
 if(core.length)n+=30;
 return n;
}
function totalXP(){let x=0;for(const d in S.days){x+=dayXP(d,dayInfo(d).type).x;}return x;}
function levelOf(xp){let i=0;for(let j=0;j<LEVELS.length;j++){if(xp>=LEVELS[j][0])i=j;}return i;} // 0-based
function isSuccess(diso){
 const inf=dayInfo(diso),r=dayRec(diso);
 if(inf.type==='rest')return false;
 if(!r.log)return false;
 if(inf.type==='half')return !!(r.retro&&r.summ);
 return (r.b||0)>=FULL_TARGETS.b&&!!r.w1&&!!r.w2;
}
function calcStreak(){
 let s=0;let d=pISO(iso());
 for(let i=0;i<120;i++){
  const diso=iso(d),inf=dayInfo(diso);
  if(inf.type!=='rest'){
   if(dayRec(diso).log)s++;
   else{if(diso<iso())break;}
  }
  d.setDate(d.getDate()-1);
 }
 return s;
}
function incTotal(){return S.income.reduce((a,e)=>a+(+e.amt||0),0);}
function incMonth(mi){return S.income.filter(e=>e.d>=MONTHS[mi].from&&e.d<=MONTHS[mi].to).reduce((a,e)=>a+(+e.amt||0),0);}
function successfulDays(){let c=0;for(const d in S.days){if(isSuccess(d))c++;}return c;}
function maxStreak(){
 let best=0,cur=0;const d=pISO(FIRST_DAY),end=pISO(iso());
 while(d<=end){
  const diso=iso(d);
  if(dayInfo(diso).type!=='rest'){
   if(dayRec(diso).log){cur++;if(cur>best)best=cur;}
   else if(diso<iso())cur=0;
  }
  d.setDate(d.getDate()+1);
 }
 return best;
}
/* Репутация 0–100: деньги — до 72 (логарифм общего дохода: $100→~7, $1k→~27,
   $10k→~52, $60k+→72) + дисциплина до 28: закрытые квоты, успешные дни, стрик, гейты. */
function reputation(){
 let q=0;
 for(const d in S.days){const r=S.days[d];
   for(const x of questsFor(dayInfo(d).type)){
    if(x.opt)continue;
    if(x.kind==='count'){if((r[x.k]||0)>=x.target)q++;}else if(r[x.k])q++;
   }}
 const gates=GATES.filter(g=>iso()>g.d).length;
 const money=Math.min(72,26*Math.log10(1+incTotal()/100));
 const disc=Math.min(28,q*0.06+successfulDays()*0.4+maxStreak()*0.5+gates*2);
 return Math.min(100,Math.round(money+disc));
}
/* Топ-%: доля фрилансеров, зарабатывающих больше тебя за последние 30 дней.
   Рыночная кривая по опорным точкам (лог-интерполяция), без потолка сверху:
   $1k/мес→~25%, $5k→~6%, $50k→~0.3%, миллиарды→0.01%. Дисциплина жмёт ещё до −35%. */
const TOP_ANCHORS=[[0,85],[100,68],[300,48],[600,35],[1200,22],[2500,12],[5000,6],[10000,2.5],[20000,1],[50000,.3],[100000,.1],[1000000,.02],[1e10,.01]];
function marketPct(inc){
 if(inc<=0)return TOP_ANCHORS[0][1];
 const x=Math.log10(inc+1);
 for(let j=1;j<TOP_ANCHORS.length;j++){
  if(inc<=TOP_ANCHORS[j][0]){
   const x0=Math.log10(TOP_ANCHORS[j-1][0]+1),x1=Math.log10(TOP_ANCHORS[j][0]+1);
   return TOP_ANCHORS[j-1][1]+(TOP_ANCHORS[j][1]-TOP_ANCHORS[j-1][1])*(x-x0)/(x1-x0);
  }
 }
 return TOP_ANCHORS[TOP_ANCHORS.length-1][1];
}
function topPct(){
 const cut=iso(new Date(Date.now()-30*86400000));
 let m30=0;for(const e of S.income){if(e.d>=cut)m30+=(+e.amt||0);}
 const boost=Math.min(.35,maxStreak()*.012+successfulDays()*.005+GATES.filter(g=>iso()>g.d).length*.03);
 return Math.max(.01,marketPct(m30)*(1-boost));
}

 if(inf.prep){

 }else{

  const rows=[['Bounty-заявки',sums.b,WEEK_TARGETS.b],['LaborX-отклики',sums.lx,WEEK_TARGETS.lx],['Лиды',sums.ld,WEEK_TARGETS.ld],['Касания',sums.t,WEEK_TARGETS.t]];

/* ===== Вспомогательные ===== */
let POP=null; // только что отмеченный квест — для pop-анимации
function incRow(e){
 const src=SOURCES.find(s=>s[0]===e.src)||SOURCES[4];
 const lbl=(e.src&&e.src!=='X')?(src[1]+' · '):'';
 return '<div class="incrow"><div class="srcb">'+(e.src&&e.src!=='X'?src[0]:'$')+'</div>'
  +'<div class="it"><div class="ia">+'+fmtN(e.amt)+' USDT</div><div class="id">'+lbl+fmtD(e.d)+'</div></div>'
  +'<button class="del" onclick="delInc('+S.income.indexOf(e)+')" aria-label="Удалить">'+icon('trash',16)+'</button></div>';
}
function fmtN(x){return Math.round(+x||0).toLocaleString('ru-RU');}
function fmtD(s){const d=pISO(s);return d.getDate()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getFullYear()).slice(2);}
function decl(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;}
function nextGate(){for(const g of GATES){if(iso()<=g.d)return g;}return null;}
function bump(diso,k,delta){
 const r=S.days[diso]||(S.days[diso]={});
 const q=questsFor(dayInfo(diso).type).find(x=>x.k===k);
 const cur=r[k]||0;let nv=cur+delta;
 nv=Math.max(0,Math.min(99,nv));
 if(nv===cur&&delta>0){toast('Квота по «'+q.name+'» уже перекрыта — качество важнее объёма');return;}
 r[k]=nv;
 if(q&&q.kind==='count'&&nv>=q.target&&cur<q.target)POP={d:diso,k};
 save();render(true);
}
function toggle(diso,k){
 const r=S.days[diso]||(S.days[diso]={});
 r[k]=!r[k];
 if(r[k])POP={d:diso,k};
 save();render(true);
}
function delInc(i){S.income.splice(i,1);save();render(true);toast('Запись удалена');}

/* ===== Новый профит: мини-окно → тир → анимация ===== */
function hexA(h,a){const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
function openIncome(){
 if(FX.busy)return;
 openModal(
  '<div class="minih"><div class="mt">Введите доход</div><div class="ms">Фактическая сумма в USDT, которая пришла на кошелёк или биржу</div></div>'
  +'<div class="field"><input id="f-amt" class="amt" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0" autocomplete="off" '
  +'onkeydown="if(event.key===\'Enter\'){event.preventDefault();confirmIncome();}"></div>'
  +'<button class="btn" id="f-ok" onclick="confirmIncome()">Принять</button>',true);
 setTimeout(()=>{const el=document.getElementById('f-amt');if(el)el.focus();},180);
}
function confirmIncome(){
 if(FX.busy)return;
 const el=document.getElementById('f-amt');
 const amt=parseFloat((el.value||'').replace(',','.'));
 if(!(amt>0)){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');toast('Сумма должна быть больше нуля');return;}
 const d=iso();
 if(d<FIRST_DAY||d>PLAN_END){toast('Дата вне плана (22.11.2026 — 21.02.2027)');return;}
 FX.busy=true;
 S.income.push({d,amt:Math.round(amt*100)/100,src:'X'});

function celebrate(amt,tier){
 const mc=document.getElementById('mcard');
 mc.innerHTML='<div class="celeb"><div class="ck" style="background:'+hexA(tier.c,.13)+';border-color:'+hexA(tier.c,.55)+';color:'+tier.c+'">'+icon('check',38)+'</div>'
  +'<div class="tw t'+tier.t+'" style="color:'+tier.c+'">'+tier.w+'</div>'
  +'<div class="ta">+'+fmtN(amt)+' USDT записаны</div></div>';
 setTimeout(()=>{
  const rect=mc.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  mc.classList.add('collapse');
  burst(cx,cy,tier.n);
 },tier.t>=4?1500:950);
}
function burst(cx,cy,n){
 const fx=document.getElementById('fx');fx.innerHTML='';
 const items=[];
 for(let i=0;i<n;i++){
  const el=document.createElement('span');
  el.className='emoji';el.textContent='💸';
  fx.appendChild(el);
  const ang=(Math.PI*2*i)/n+Math.random()*0.6;
  const rad=76+Math.random()*72;
  const x=cx+Math.cos(ang)*rad, y=cy+Math.sin(ang)*rad-18;
  items.push({el:el,x:x,y:y,anim:el.animate([
   {transform:'translate('+cx+'px,'+cy+'px) scale(.35)',opacity:0},
   {transform:'translate('+x+'px,'+y+'px) scale(1.18)',opacity:1,offset:.72},
   {transform:'translate('+x+'px,'+y+'px) scale(1)',opacity:1}
  ],{duration:500+Math.random()*220,delay:i*45,easing:'cubic-bezier(.18,.86,.28,1)',fill:'both'})});
 }
 const target=document.querySelector('#tabbar button[data-tab="profile"]');
 const hold=900+(n-1)*45+300; // разлетелись и замерли
 setTimeout(()=>{if(target)flyHome(items,target);else finishFX();},hold);
}
function flyHome(items,target){
 const tr=target.getBoundingClientRect();
 const tx=tr.left+tr.width/2,ty=tr.top+tr.height/2;
 let done=0;
 items.forEach((it,i)=>{
  it.el.style.transform='translate('+it.x+'px,'+it.y+'px) scale(1)';
  it.el.style.opacity='1';
  if(it.anim)it.anim.cancel();
  const dur=640+Math.random()*160;
  const cxs=(it.x+tx)/2+(Math.random()*150-75);
  const cys=Math.min(it.y,ty)-95-Math.random()*70;
  const t0=performance.now()+i*55;
  function step(t){
   let p=(t-t0)/dur;
   if(p<=0){requestAnimationFrame(step);return;}
   p=Math.min(1,p);
   const e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
   const x=(1-e)*(1-e)*it.x+2*(1-e)*e*cxs+e*e*tx;
   const y=(1-e)*(1-e)*it.y+2*(1-e)*e*cys+e*e*ty;
   it.el.style.transform='translate('+x+'px,'+y+'px) scale('+(1-.3*e)+')';
   it.el.style.opacity=e>.94?String(Math.max(0,(1-e)/.06)):'1';
   if(p<1){requestAnimationFrame(step);}
   else{done++;if(done===items.length)arrive(target);}
  }
  requestAnimationFrame(step);
 });
}
function arrive(target){
 target.classList.add('pulse');
 setTimeout(()=>target.classList.remove('pulse'),900);
 const m=document.getElementById('modal');
 m.classList.add('fadeout');
 setTimeout(finishFX,330);
}
function finishFX(){
 FX.busy=false;
 closeModal();
 document.getElementById('fx').innerHTML='';
 render();
 toast('Профит записан — цели, статы и XP обновлены');
}

/* ===== Анимации входа на вкладку ===== */
function animBars(){
 document.querySelectorAll('.bar>i[data-w]').forEach(el=>{
  const w=el.dataset.w;if(!(+w>0))return;
  el.style.transition='none';el.style.width='0%';void el.offsetWidth;
  el.style.transition='';el.style.width=w+'%';
 });
}
function animRings(){
 document.querySelectorAll('.ring').forEach(el=>{
  const f=el.style.getPropertyValue('--p')||'0';if(!(+f>0))return;
  el.style.transition='none';el.style.setProperty('--p','0');void el.offsetWidth;
  el.style.transition='';el.style.setProperty('--p',f);
 });
}
function countUp(el){
 const target=+el.dataset.cnt||0;if(!target){el.textContent='0';return;}
 const t0=performance.now(),dur=780;
 function st(t){let p=Math.min(1,(t-t0)/dur);p=1-Math.pow(1-p,3);
  el.textContent=fmtN(target*p);
  if(p<1)requestAnimationFrame(st);
 }
 requestAnimationFrame(st);
}
function enterAnim(){
 if(tab==='goals'){animRings();animBars();}
 else if(tab==='profile'){animBars();document.querySelectorAll('[data-cnt]').forEach(countUp);}
 else if(tab==='today'||tab==='stats'){animBars();}
}

function importJSON(inp){

  catch(e){toast('Файл не похож на экспорт панели');}};
 rd.readAsText(f);inp.value='';
}
